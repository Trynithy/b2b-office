name: Mise à jour du calendrier

on:
  schedule:
    - cron: "0 5 * * *"      # tous les jours à 5h UTC (6h ou 7h à Paris)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write             # autorise le robot à enregistrer schedule.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5     # v5 = Node 24 (Node 20 est retiré des serveurs GitHub)

      - name: Télécharger le calendrier
        run: python3 build_schedule.py  # Python est déjà installé sur ubuntu-latest

      - name: Enregistrer schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet && echo "Aucun changement" || git commit -m "Calendrier mis à jour"
          git push
